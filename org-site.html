<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATOMIC - Esports Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg2: #ffffff;
    --bg3: #fdf2f8;
    --border: rgba(255, 182, 193, 0.4);
    --border2: rgba(255, 182, 193, 0.6);
    --accent: #f472b6; 
    --accent2: #60a5fa;
    --text: #1e293b; 
    --text2: #475569;
    --text3: #94a3b8;
    --gold: #fbbf24;
    --card-radius: 14px;
  }

  body {
    /* Fondo de Arte Abstracto Mixto */
    background-image: 
      radial-gradient(at 0% 0%, rgba(96, 165, 250, 0.15) 0px, transparent 50%),
      radial-gradient(at 100% 0%, rgba(244, 114, 182, 0.15) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(96, 165, 250, 0.15) 0px, transparent 50%),
      linear-gradient(125deg, #f0faff 0%, #e0f2fe 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem; height: 60px;
  }
  .nav-logo {
    font-family: 'Rajdhani', sans-serif;
    font-size: 24px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  .shield {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border2);
    background: var(--bg2); color: var(--text2);
    transition: 0.15s;
  }
  .btn:hover { background: var(--bg3); border-color: var(--accent); }
  .btn-primary { background: var(--accent); color: #fff; border-color: transparent; }

  .hero { text-align: center; padding: 4rem 1rem 2rem; }
  .hero-title { font-family: 'Rajdhani', sans-serif; font-size: clamp(40px, 8vw, 70px); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
  .hero-title span { color: var(--accent); }

  .hero-stats { display: flex; justify-content: center; gap: 3rem; margin-top: 2rem; }
  .hero-stat { text-align: center; }
  .hero-stat-num { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700; color: var(--text); }
  .hero-stat-label { font-size: 12px; color: var(--text3); text-transform: uppercase; font-weight: 600; }

  .section { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
  .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

  .player-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
  }
  .player-card:hover { transform: translateY(-5px); border-color: var(--accent); background: #fff; }

  .player-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--bg3);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 15px; overflow: hidden;
    font-family: 'Rajdhani', sans-serif; font-weight: 700; color: var(--accent); font-size: 24px;
  }
  .player-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .profile-panel {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--card-radius); margin-bottom: 2rem;
    padding: 2rem; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  }
  .profile-panel.visible { display: block; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 200;
  }
  .modal-backdrop.open { display: flex; }
  .modal { background: #fff; padding: 2rem; border-radius: 16px; width: 100%; max-width: 500px; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 11px; margin-bottom: 5px; text-transform: uppercase; color: var(--text3); }
  .field input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); }

  .lock-modal { position: fixed; inset: 0; background: #f0faff; z-index: 300; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div class="lock-modal" id="lock-modal">
  <div style="text-align:center; background:white; padding:2.5rem; border-radius:20px; border:1px solid var(--border); box-shadow: 0 15px 35px rgba(0,0,0,0.05);">
    <h2 style="margin-bottom:1.5rem; font-family:'Rajdhani';">ATOMIC SYSTEM</h2>
    <input id="lock-input" type="password" placeholder="Password" style="padding:12px; border-radius:10px; border:1px solid var(--border); width: 200px; margin-bottom:15px;"><br>
    <button class="btn btn-primary" onclick="tryUnlock()" style="width: 200px; justify-content: center;">Enter</button>
  </div>
</div>

<nav>
  <div class="nav-logo"><div class="shield"><i class="ti ti-atom-2"></i></div> ATOMIC</div>
  <button class="btn" style="color:var(--text3);" onclick="location.reload()">Logout</button>
</nav>

<div class="hero">
  <div class="hero-title"><span>ATOMIC</span> ORG</div>
  
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="hero-stat-num" id="stat-members">0</div>
      <div class="hero-stat-label">Players</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num" id="stat-champs">0</div>
      <div class="hero-stat-label" style="color:var(--gold);">Total Champs</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num" id="stat-earnings">$0</div>
      <div class="hero-stat-label">Earnings</div>
    </div>
  </div>
</div>

<div class="section">
  <div id="profile-panel" class="profile-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
       <h2 id="p-name" style="font-family:'Rajdhani'; font-size:32px;"></h2>
       <div id="p-admin-btns"></div>
    </div>
    <div style="display:flex; gap:15px; margin: 10px 0;">
      <span id="p-role" style="color:var(--accent); font-weight:700;"></span>
      <span id="p-stat-line" style="color:var(--text3);"></span>
    </div>
    <p id="p-bio" style="color:var(--text2); line-height:1.6;"></p>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
    <h3 style="font-family:'Rajdhani'; text-transform:uppercase; letter-spacing:1px;">Active Roster</h3>
    <button class="btn btn-primary" id="btn-add" style="display:none;" onclick="openAdd()">+ Add Player</button>
  </div>
  
  <div class="roster-grid" id="roster-grid"></div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 id="modal-title" style="margin-bottom:1.5rem; font-family:'Rajdhani';">Player Data</h2>
    <div class="field"><label>Tag</label><input id="f-tag"></div>
    <div class="field"><label>Role</label><input id="f-role"></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
      <div class="field"><label>Champs (Número)</label><input id="f-champs" type="number"></div>
      <div class="field"><label>Earnings ($)</label><input id="f-earn" type="number"></div>
    </div>
    <div class="field"><label>Image URL</label><input id="f-img" placeholder="https://..."></div>
    <div class="field"><label>Bio</label><input id="f-bio"></div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveForm()">Save Player</button>
    </div>
  </div>
</div>

<script>
const ADMIN_PASS = "artz2024";
let isAdmin = false;
let editingId = null;
let players = JSON.parse(localStorage.getItem("esports_players")) || [
  {id: 1, tag: "Artz", role: "Founder", earnings: 3000, champs: 5, image: "", bio: "Atomic Leader."}
];

function tryUnlock() {
  if(document.getElementById("lock-input").value === ADMIN_PASS) {
    isAdmin = true;
    document.getElementById("lock-modal").style.display = "none";
    document.getElementById("btn-add").style.display = "block";
    render();
  }
}

function render() {
  const grid = document.getElementById("roster-grid");
  grid.innerHTML = "";
  let totalE = 0;
  let totalC = 0;

  players.forEach(p => {
    totalE += parseFloat(p.earnings || 0);
    totalC += parseInt(p.champs || 0);
    
    const card = document.createElement("div");
    card.className = "player-card";
    const avatar = p.image ? `<img src="${p.image}">` : p.tag.slice(0,2).toUpperCase();
    
    card.innerHTML = `
      <div class="player-avatar">${avatar}</div>
      <div style="font-weight:700; font-size:18px;">${p.tag}</div>
      <div style="font-size:12px; color:var(--text3); margin-bottom:8px;">${p.role}</div>
      <div style="display:flex; justify-content:center; gap:10px; font-size:11px; font-weight:700;">
        <span style="color:var(--gold);"><i class="ti ti-trophy"></i> ${p.champs || 0}</span>
        <span style="color:var(--text3);">$${(p.earnings || 0).toLocaleString()}</span>
      </div>
    `;
    card.onclick = () => showProfile(p.id);
    grid.appendChild(card);
  });

  document.getElementById("stat-members").textContent = players.length;
  document.getElementById("stat-champs").textContent = totalC;
  document.getElementById("stat-earnings").textContent = "$" + totalE.toLocaleString();
}

function showProfile(id) {
  const p = players.find(x => x.id === id);
  document.getElementById("p-name").textContent = p.tag;
  document.getElementById("p-role").textContent = p.role;
  document.getElementById("p-stat-line").textContent = `Champs: ${p.champs || 0} | Earnings: $${(p.earnings || 0).toLocaleString()}`;
  document.getElementById("p-bio").textContent = p.bio || "No bio available.";
  
  const adminSlot = document.getElementById("p-admin-btns");
  adminSlot.innerHTML = isAdmin ? `
    <button class="btn" onclick="openEdit(${p.id})">Edit</button>
    <button class="btn btn-danger" onclick="deletePlayer(${p.id})"><i class="ti ti-trash"></i></button>
  ` : "";
  
  document.getElementById("profile-panel").classList.add("visible");
  window.scrollTo({ top: 200, behavior: 'smooth' });
}

function openAdd() {
  editingId = null;
  document.getElementById("modal-title").textContent = "Add New Player";
  document.querySelectorAll('.modal input').forEach(i => i.value = "");
  document.getElementById("modal-backdrop").classList.add("open");
}

function openEdit(id) {
  editingId = id;
  const p = players.find(x => x.id === id);
  document.getElementById("modal-title").textContent = "Edit Player";
  document.getElementById("f-tag").value = p.tag;
  document.getElementById("f-role").value = p.role;
  document.getElementById("f-champs").value = p.champs;
  document.getElementById("f-earn").value = p.earnings;
  document.getElementById("f-img").value = p.image;
  document.getElementById("f-bio").value = p.bio;
  document.getElementById("modal-backdrop").classList.add("open");
}

function closeModal() { document.getElementById("modal-backdrop").classList.remove("open"); }

function saveForm() {
  const data = {
    tag: document.getElementById("f-tag").value.trim(),
    role: document.getElementById("f-role").value.trim(),
    champs: parseInt(document.getElementById("f-champs").value) || 0,
    earnings: parseFloat(document.getElementById("f-earn").value) || 0,
    image: document.getElementById("f-img").value.trim(),
    bio: document.getElementById("f-bio").value.trim()
  };

  if(editingId) {
    const idx = players.findIndex(x => x.id === editingId);
    players[idx] = { ...players[idx], ...data };
  } else {
    players.push({ id: Date.now(), ...data });
  }

  localStorage.setItem("esports_players", JSON.stringify(players));
  render();
  closeModal();
  document.getElementById("profile-panel").classList.remove("visible");
}

function deletePlayer(id) {
  if(confirm("¿Eliminar este jugador?")) {
    players = players.filter(x => x.id !== id);
    localStorage.setItem("esports_players", JSON.stringify(players));
    render();
    document.getElementById("profile-panel").classList.remove("visible");
  }
}

render();
</script>
</body>
</html>
